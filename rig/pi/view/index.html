<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turbidity Rig</title>
  <link rel="stylesheet" href="view.css">
</head>
<body>
  <main>
    <h1>Turbidity rig</h1>
    <p>Read-only. This page cannot change or control anything.</p>

    <section id="status" class="status none" role="status">
      <strong id="status-title">Loading…</strong>
      <span id="status-detail"></span>
    </section>

    <section class="reading">
      <p class="label">Latest good reading</p>
      <p id="reading" class="value">–</p>
      <p id="reading-time" class="label"></p>
    </section>

    <section>
      <h2>Good readings over time</h2>
      <p class="label">ADC counts, not yet calibrated. Lower means a denser culture.</p>
      <div id="chart"></div>
      <p id="hover" class="label">&nbsp;</p>
    </section>

    <section>
      <h2>Last 10 cycles</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Time</th><th class="number">Reading</th><th>Result</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <p id="checked" class="label"></p>
      <p><a href="summary.csv" download>Download the summary CSV</a></p>
    </footer>
  </main>
  <script src="view.js"></script>
</body>
</html>
