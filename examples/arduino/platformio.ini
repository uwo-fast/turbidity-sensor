; Shared settings; each [env:*] below builds the example for one board.
; Upload with: pio run -d examples/arduino -e <env> -t upload
[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
; symlink:// links the repo in place; file:// would copy all of it, .git included.
lib_deps = symlink://../..
build_flags =
  -DTURBIDITY_ANALOG_PIN=A0
  -DTURBIDITY_ADC_MAX_COUNT=1024.0
  -DTURBIDITY_ADC_REF_MV=5000.0
  -DTURBIDITY_SAMPLE_PERIOD_MS=100
  -DTURBIDITY_OVERSAMPLE=16
  -DTURBIDITY_SENSOR_KIND=TURBIDITY_SENSOR_TSW10
  -DTURBIDITY_TRIM_T=0.5
  -DTURBIDITY_GAIN=1.0
  -DTURBIDITY_OFFSET_MV=0.0
  -DTURBIDITY_FILTER_WINDOW=8

[env:uno]
board = uno

; Arduino Nano with the current (Optiboot) bootloader.
[env:nano]
board = nanoatmega328new

; Arduino Nano and most clones with the old bootloader; try this if uploads to "nano" time out.
[env:nano_oldbootloader]
board = nanoatmega328

; Uno with the 470 ohm emitter resistor wired to D7 instead of GND; also logs dark_adc_counts.
[env:uno_switched_emitter]
board = uno
build_flags =
  ${env.build_flags}
  -DTURBIDITY_EMITTER_PIN=7
