; Bench logger for several heads at once (A0-A3 by default; see src/main.cpp).
; Upload with: just upload nano arduino-multichannel
[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags =
  -DTURBIDITY_SAMPLE_PERIOD_MS=100
  -DTURBIDITY_OVERSAMPLE=16

; Arduino Nano with the current (Optiboot) bootloader.
[env:nano]
board = nanoatmega328new

; Arduino Nano and most clones with the old bootloader; try this if uploads to "nano" time out.
[env:nano_oldbootloader]
board = nanoatmega328

[env:uno]
board = uno
