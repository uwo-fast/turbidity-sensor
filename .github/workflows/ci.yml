name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pinned clang tools
        run: python3 -m pip install clang-format==18.1.8 clang-tidy==18.1.8

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Regenerate calibration artifacts
        run: just regen

      - name: Verify generated artifacts are up to date
        run: git diff --exit-code -- data/calibration src/turbidity_model_data.generated.h

      - name: Check
        run: just check

      - name: Test
        run: just test

  # The sampler case's fit test. OpenSCAD is pinned to the same development snapshot as
  # open-source-bioreactor, which consumes the case, so both render it with one binary. Move the
  # date and its sha256 together, in both repositories.
  sampler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      # The AppImage is extracted, so it needs no FUSE; it takes its GL libraries from the host.
      - name: Install OpenSCAD
        env:
          OPENSCAD_SNAPSHOT: "2026.10.15"
          OPENSCAD_SHA256: "9d26e390d3a5c94f2e304d94d7b2eff77fb11fcd25829f2814de147ba92ac363"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libopengl0 libglx0 libgbm1 libwayland-client0 libx11-xcb1 fontconfig
          dir="$RUNNER_TEMP/openscad"
          file="OpenSCAD-$OPENSCAD_SNAPSHOT-x86_64.AppImage"
          mkdir -p "$dir/bin"
          curl -fsSL -o "$dir/$file" "https://files.openscad.org/snapshots/$file"
          echo "$OPENSCAD_SHA256  $dir/$file" | sha256sum -c -
          chmod +x "$dir/$file"
          (cd "$dir" && "./$file" --appimage-extract > /dev/null)
          printf '#!/bin/sh\nexec "%s/squashfs-root/AppRun" "$@"\n' "$dir" > "$dir/bin/openscad"
          chmod +x "$dir/bin/openscad"
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/openscad" --version

      - name: Install the OpenSCAD libraries
        run: just scad-setup

      - name: Check the sampler case's fits
        run: just check-sampler-case

  arduino-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python3 -m pip install platformio

      - name: Compile Arduino examples
        run: |
          pio run -d examples/arduino
          pio run -d examples/arduino-multichannel
