name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pinned clang tools
        run: python3 -m pip install clang-format==18.1.8 clang-tidy==18.1.8

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Regenerate calibration artifacts
        run: just regen

      - name: Verify generated artifacts are up to date
        run: git diff --exit-code -- data/calibration src/turbidity_model_data.generated.h

      - name: Check
        run: just check

      - name: Test
        run: just test

  arduino-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python3 -m pip install platformio

      - name: Compile Arduino example
        run: pio run -d examples/arduino
